name: Deploy cv-next

on:
  push:
    branches: [master]
    paths:
      - "cv-next/**"

  workflow_dispatch:

jobs:
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv-next

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('cv-next/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.CV_API_BASE_URL || 'http://localhost:5113' }}

  deploy:
    name: Trigger Dokploy
    runs-on: ubuntu-latest
    needs: build-check

    steps:
      - name: Call Dokploy webhook
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/dokploy_response.txt -w "%{http_code}" \
            -X POST "${{ secrets.DOKPLOY_CV_WEBHOOK_URL }}" \
            -H "Content-Type: application/json")

          BODY=$(cat /tmp/dokploy_response.txt)
          echo "Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Dokploy webhook failed with HTTP $HTTP_STATUS"
            exit 1
          fi
