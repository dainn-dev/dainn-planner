# cv-next — run from this directory: docker compose up --build -d
#
# Override env via .env file in this folder:
#   NEXT_PUBLIC_API_BASE_URL=https://api.dainn.online
#   ROOT_DOMAIN=dainn.online

services:
  cv-next:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.dainn.online}
    container_name: cv-next
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.dainn.online}
      SSR_API_BASE_URL: ${SSR_API_BASE_URL:-http://host.docker.internal:8080}
      ROOT_DOMAIN: ${ROOT_DOMAIN:-dainn.online}
    ports:
      - "${CV_PORT:-3001}:3000"
    restart: unless-stopped
